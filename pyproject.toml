[project]
name = "aris"
dynamic = ["version"]
description = "拟人 AI Aris —— 目标是社会学意义上的人"
readme = "README.md"
# TODO(3.15): 等 OpenVINO 提供 cp315 wheel 后再升，见 docs/developDoc/BACKLOG.md #11
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "openai>=2.0",
    "httpx>=0.28",
    "prompt-toolkit>=3.0.53",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
    "tomli-w>=1.2.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[project.scripts]
aris = "aris.cli:main"

[tool.uv.sources]
# torch / torchvision 在 Linux 默认拉 CUDA wheel（本机无 NVIDIA GPU，纯浪费体积），
# 且两者必须同源同版本，否则 torchvision::nms 算子缺失导致 transformers 导入失败
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# 开发依赖（uv sync 默认安装 dev group；测试运行：uv run pytest）
[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "ruff>=0.17.2",
]
# 本地 embedding（重依赖，见 docs/developDoc/EMBEDDING.md）：默认安装，
# 想要轻量环境可用 `uv sync --no-default-groups`
embedding = [
    "sentence-transformers>=5",
    "optimum[openvino]>=1.20",
    "openvino>=2025",
    "transformers<5.1",
    "torch",
    "torchvision",
]

[tool.uv]
# 版本号唯一源是 src/aris/__init__.py（pyproject 用 dynamic version）；
# 不声明 cache-key 的话 uv 只按 pyproject.toml 判定缓存，改了 __init__.py 也不会重建
cache-keys = [{ file = "src/aris/__init__.py" }]
# 默认把 embedding 组也装上：避免「uv run 隐式把重依赖卸掉」的坑
default-groups = ["dev", "embedding"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "aris.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

# 代码格式与静态检查（AGENTS.md §2/§7）；文档目录不参与
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "RUF", "C4", "PERF"]
# 中文注释/文案里的全角标点会被 RUF001-003 判为「易混淆字符」，本项目不适用
ignore = ["RUF001", "RUF002", "RUF003"]

# mypy 渐进推进：先只查 core + store，稳定后再逐步扩大
[tool.mypy]
python_version = "3.12"
files = ["src/aris/core", "src/aris/store"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
