# 联网搜索模块配置（引擎池：Bing 直连 / Tavily 含 keyless / Exa 经 mcp）

# 首选搜索引擎（"bing"/"tavily"/"exa"/"auto"），失败自动按序兜底
# exa 引擎还要 mcp.server 已连接才生效（data/config/mcp.toml 里 [servers.exa]）
# auto = 按查询语言分流（含中文走 Tavily），仅在需要时切换
prefer_engine = "bing"

# HTTP 请求超时（秒）
timeout_seconds = 15.0

# 返回搜索结果条数
results_count = 5

# 摘要截断长度（字符，省 token）
snippet_max_len = 200

# web_open：抓取网页正文的超时（秒）
webopen_timeout_seconds = 20.0

# web_open：返回正文最大长度（字符，截断省 token）
webopen_max_chars = 4000

# http_request：单次返回内容上限（字符，截断省 token）
http_request_max_chars = 4000

# http_request：请求超时（秒）
http_request_timeout_seconds = 20.0
