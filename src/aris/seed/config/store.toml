# store 模块可调参数（优先级：代码内默认值 < 本文件）

# embedding 提供方："local" = 本地 Bekko a25m（384 维，需 uv sync --group embedding）
embedding_provider = "local"

# 本地模型：HF 仓库 id，或 data/models/ 下的目录名（本地目录优先）
local_model = "hotchpotch/bekko-embedding-v1-a25m"

# 本地推理一次喂多少条（批量吞吐实测约 324 docs/s @25 条/批）
batch_size = 16

# Matryoshka 截断维度（取消注释可降到 256 维，省存储与检索开销）
# truncate_dim = 256

# 外部组件镜像：只换下载地址，校验值永远以代码（infra/components.py）为准。
# 键 "<id>" = 镜像目录，按当前平台自动拼官方文件名；"<id>.<platform>" = 完整 URL 精确覆盖。
# [mirror]
# micromamba = "https://你的镜像/2.9.0-0"
# "micromamba.linux-aarch64" = "https://你的镜像/完整文件地址"
